<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
<meta name="apple-mobile-web-app-title" content="Finance"/>
<meta name="theme-color" content="#1a1a1a"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="apple-touch-icon" href="icons/icon128.png"/>
<title>Finance Tracker</title>
<style>
  html, body { margin: 0; padding: 0; background: #1a1a1a; color: #888; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 20px;
  }
  a { color: #4af; }
</style>
</head>
<body>
<!--
  v9: lock.html is no longer a separate screen. The lock UI is now an
  in-page overlay inside index.html, which avoids the iOS standalone-PWA
  cross-file navigation bug. We keep this file only so that existing
  Home Screen icons (whose start_url points at lock.html) still work — we
  bounce them straight to index.html. ?reset=1 is forwarded so the user
  can clear a forgotten PIN from this entry point too.
-->
<div>Loading Finance Tracker…</div>
<script>
(function(){
  function panel(){
    var d = document.getElementById('ft-jserr');
    if (d) return d;
    d = document.createElement('div');
    d.id = 'ft-jserr';
    d.style.cssText = 'position:fixed;top:0;left:0;right:0;max-height:55vh;overflow:auto;background:#fee;color:#900;padding:8px 10px;font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;z-index:99999;white-space:pre-wrap;border-bottom:2px solid #f99;-webkit-user-select:text;user-select:text';
    (document.body || document.documentElement).appendChild(d);
    return d;
  }
  window.addEventListener('error', function(e){
    try {
      var p = panel();
      var src = e && e.filename ? String(e.filename).split('/').pop() : '?';
      p.textContent += 'ERR ' + src + ':' + (e && e.lineno || '?') + ' ' + (e && e.message || '') + '\n';
    } catch (err) {}
  });
})();
(function(){
  try {
    var search = window.location.search || '';
    var hash   = window.location.hash   || '';
    var target = './index.html' + search + hash;
    window.location.replace(target);
  } catch (e) {
    document.body.innerHTML = '<div style="color:#fff;text-align:center">Could not redirect. Please open <a style="color:#4af" href="./index.html">index.html</a></div>';
  }
})();
</script>
</body>
</html>
