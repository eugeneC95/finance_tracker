<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 220px; padding: 20px 18px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #1a1a1a; color: #fff; text-align: center; }
    .logo { margin-bottom: 10px; line-height: 0; }
    .logo img { width: 40px; height: 40px; border-radius: 12px; }
    h1 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    p  { font-size: 11px; color: #aaa; margin-bottom: 16px; line-height: 1.5; }
    button {
      width: 100%; height: 38px; background: #fff; color: #1a1a1a;
      border: none; border-radius: 9px; font-size: 13px; font-weight: 700;
      cursor: pointer; transition: opacity .15s;
    }
    button:hover { opacity: .85; }
  </style>
</head>
<body>
  <div class="logo"><img src="../assets/brand-logo.svg" width="40" height="40" alt=""/></div>
  <h1>Finance Tracker</h1>
  <p>Click to open your full dashboard</p>
  <button id="open-btn">Open dashboard →</button>
  <script src="popup-btn.js"></script>
</body>
</html>
