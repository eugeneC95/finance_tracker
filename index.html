<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<script>
// Redirect to lock screen if not authenticated this session.
// If sessionStorage is missing or cleared across location.replace (seen on some
// mobile browsers), lock.html sets a short-lived ft_unlock_bridge in localStorage.
(function(){
  var BRIDGE_KEY = 'ft_unlock_bridge';
  var BRIDGE_MS = 45000;
  try {
    if (sessionStorage.getItem('ft-unlocked') === '1') return;
    var raw = localStorage.getItem(BRIDGE_KEY);
    if (raw) {
      var ts = parseInt(raw, 10);
      if (!isNaN(ts) && (Date.now() - ts) < BRIDGE_MS) {
        try { sessionStorage.setItem('ft-unlocked', '1'); } catch (e2) {}
        try { localStorage.removeItem(BRIDGE_KEY); } catch (e3) {}
        return;
      }
      try { localStorage.removeItem(BRIDGE_KEY); } catch (e4) {}
    }
    window.location.replace('./lock.html');
  } catch (e) {}
})();
</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Finance"/>
<meta name="theme-color" content="#1a1a1a"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="apple-touch-icon" href="icons/icon128.png"/>
<title>Finance Tracker</title>
<style>
/* ============================================================
   RESET
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; }

/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root {
  /* Colours – light */
  --page-bg  : #F2F2F0;
  --card-bg  : #FFFFFF;
  --card-bg2 : #F8F8F6;
  --line     : #E6E6E2;
  --line2    : #CBCBC6;
  --ink      : #1A1A1A;
  --ink2     : #5A5A54;
  --ink3     : #9A9A94;
  --brand    : #1A1A1A;
  --green    : #1A9E6E;
  --red      : #E24B4A;
  --blue     : #2563EB;

  /* Sidebar */
  --sb-bg    : #1A1A1A;
  --sb-w     : 224px;

  /* Space scale */
  --s1  : 4px;
  --s2  : 8px;
  --s3  : 12px;
  --s4  : 16px;
  --s5  : 20px;
  --s6  : 24px;
  --s8  : 32px;
  --s10 : 40px;

  /* Type scale */
  --f-xs : 11px;
  --f-sm : 13px;
  --f-md : 14px;
  --f-lg : 16px;
  --f-xl : 22px;
  --f-2xl: 28px;

  /* Misc */
  --radius  : 10px;
  --radius-sm: 7px;
  --shadow  : 0 1px 3px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
}

/* ── Dark theme ── */
body.dark {
  --page-bg  : #111113;
  --card-bg  : #1C1C1F;
  --card-bg2 : #252528;
  --line     : #2E2E32;
  --line2    : #48484E;
  --ink      : #F0F0F5;
  --ink2     : #AEAEB8;
  --ink3     : #56565E;
  --brand    : #F0F0F5;
  --sb-bg    : #000000;
}

/* ── Font size modes ── */
body.fs-sm { --f-xs:10px; --f-sm:12px; --f-md:13px; --f-lg:15px; --f-xl:19px; --f-2xl:24px; }
body.fs-md { --f-xs:11px; --f-sm:13px; --f-md:14px; --f-lg:16px; --f-xl:22px; --f-2xl:28px; }
body.fs-lg { --f-xs:12px; --f-sm:14px; --f-md:15px; --f-lg:18px; --f-xl:25px; --f-2xl:32px; }

/* ============================================================
   LAYOUT SHELL
   ============================================================ */
html, body { height: 100%; }
body {
  display: flex;
  background: var(--page-bg);
  color: var(--ink);
  font-size: var(--f-md);
  line-height: 1.5;
  transition: background .2s, color .2s;
}

/* ============================================================
   SIDEBAR
   ============================================================ */
.sb {
  width: var(--sb-w);
  flex-shrink: 0;
  background: var(--sb-bg);
  display: flex;
  flex-direction: column;
  height: 100vh;
  position: sticky;
  top: 0;
}

.sb-brand {
  padding: var(--s6) var(--s5) var(--s5);
  border-bottom: 1px solid rgba(255,255,255,.08);
}
.sb-brand .logo { font-size: 26px; line-height: 1; margin-bottom: var(--s2); }
.sb-brand .name { font-size: var(--f-lg); font-weight: 700; color: #fff; letter-spacing: -.3px; }
.sb-brand .tagline { font-size: var(--f-xs); color: rgba(255,255,255,.4); margin-top: 2px; }

.sb-nav {
  flex: 1;
  padding: var(--s3) var(--s3);
  display: flex;
  flex-direction: column;
  gap: var(--s1);
  overflow-y: auto;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding: 10px var(--s3);
  border-radius: var(--radius-sm);
  border: none;
  background: none;
  color: rgba(255,255,255,.5);
  font-size: var(--f-sm);
  font-weight: 500;
  width: 100%;
  text-align: left;
  transition: background .12s, color .12s;
}
.nav-item .icon { font-size: 17px; width: 22px; text-align: center; flex-shrink: 0; }
.nav-item:hover  { background: rgba(255,255,255,.08); color: rgba(255,255,255,.85); }
.nav-item.active { background: rgba(255,255,255,.14); color: #fff; }
.nav-spacer { flex: 1; }

.sb-month {
  padding: var(--s4) var(--s3) var(--s6);
  border-top: 1px solid rgba(255,255,255,.08);
}
.sb-month .month-lbl {
  font-size: var(--f-xs);
  color: rgba(255,255,255,.35);
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-bottom: var(--s2);
}
.month-row {
  display: flex;
  align-items: center;
  gap: var(--s2);
}
.month-arrow {
  width: 28px; height: 28px;
  border-radius: var(--radius-sm);
  border: none;
  background: rgba(255,255,255,.1);
  color: #fff;
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.month-arrow:hover { background: rgba(255,255,255,.2); }
.month-name {
  flex: 1;
  text-align: center;
  font-size: var(--f-sm);
  font-weight: 600;
  color: #fff;
}

/* ============================================================
   MAIN AREA
   ============================================================ */
.main {
  flex: 1;
  min-height: 100vh;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
}

/* Pages */
.page { display: none; }
.page.active { display: block; }

/* Page header */
.page-header {
  padding: var(--s8) var(--s8) 0;
  margin-bottom: var(--s6);
}
.page-header h2 {
  font-size: var(--f-2xl);
  font-weight: 700;
  letter-spacing: -.5px;
  color: var(--ink);
}
.page-header .sub {
  font-size: var(--f-sm);
  color: var(--ink3);
  margin-top: var(--s1);
}

/* Page body */
.page-body {
  padding: 0 var(--s8) var(--s10);
  flex: 1;
}

/* ============================================================
   CARDS & PANELS
   ============================================================ */
.card {
  background: var(--card-bg);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

/* Panel = card with header */
.panel { }
.panel-hd {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s4);
  padding: var(--s4) var(--s5);
  border-bottom: 1px solid var(--line);
}
.panel-title {
  font-size: var(--f-xs);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .6px;
  color: var(--ink3);
}
.panel-bd { padding: var(--s5); }

/* Stat cards row */
.stat-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--s4);
  margin-bottom: var(--s6);
}
.stat-card {
  background: var(--card-bg);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: var(--s5) var(--s5);
  box-shadow: var(--shadow);
}
.stat-card .s-label {
  font-size: var(--f-xs);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .5px;
  color: var(--ink3);
  margin-bottom: var(--s2);
}
.stat-card .s-value {
  font-size: var(--f-xl);
  font-weight: 700;
  color: var(--ink);
  line-height: 1;
}
.stat-card .s-value.green { color: var(--green); }
.stat-card .s-value.red   { color: var(--red); }

/* ============================================================
   FORMS
   ============================================================ */
.lbl {
  display: block;
  font-size: var(--f-xs);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .4px;
  color: var(--ink3);
  margin-bottom: var(--s2);
}

input[type="text"],
input[type="number"],
input[type="date"],
select,
textarea {
  display: block;
  width: 100%;
  height: 42px;
  padding: 0 var(--s4);
  background: var(--card-bg2);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  color: var(--ink);
  font-size: var(--f-md);
  outline: none;
  transition: border-color .15s, background .15s;
  appearance: none;
  -webkit-appearance: none;
}
input::placeholder { color: var(--ink3); }
input:focus, select:focus { border-color: var(--line2); background: var(--card-bg); }

textarea {
  height: auto;
  padding: var(--s3) var(--s4);
  resize: vertical;
  font-size: var(--f-sm);
  font-family: monospace;
  line-height: 1.6;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--s2);
  height: 42px;
  padding: 0 var(--s5);
  border: none;
  border-radius: var(--radius-sm);
  font-size: var(--f-md);
  font-weight: 600;
  white-space: nowrap;
  transition: opacity .15s, transform .1s;
}
.btn:hover  { opacity: .84; }
.btn:active { transform: scale(.97); }

.btn-primary { background: var(--brand); color: var(--card-bg); }
body.dark .btn-primary { color: #000; }
.btn-green   { background: var(--green); color: #fff; }
.btn-ghost   {
  background: none;
  border: 1px solid var(--line);
  color: var(--ink2);
  font-size: var(--f-sm);
  height: 36px;
}
.btn-ghost:hover { border-color: var(--line2); background: var(--card-bg2); opacity: 1; }
.btn-ghost.green { border-color: var(--green); color: var(--green); }
.btn-ghost.green:hover { background: rgba(26,158,110,.08); }

/* ============================================================
   CATEGORY BUTTON GRID
   ============================================================ */
.cat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
  gap: var(--s2);
  margin-bottom: var(--s5);
}
.cat-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--s1);
  padding: var(--s3) var(--s2);
  background: var(--card-bg2);
  border: 2px solid var(--line);
  border-radius: var(--radius-sm);
  font-size: var(--f-xs);
  font-weight: 600;
  color: var(--ink2);
  transition: border-color .12s, background .12s, color .12s;
}
.cat-btn .ci { font-size: 20px; line-height: 1; }
.cat-btn:hover  { border-color: var(--line2); background: var(--card-bg); color: var(--ink); }
.cat-btn.active { border-color: var(--brand); background: var(--brand); color: #fff; }
body.dark .cat-btn.active { color: #000; }

/* Add-expense input row */
.add-row {
  display: grid;
  grid-template-columns: 1fr 150px 150px auto;
  gap: var(--s3);
  align-items: end;
}

/* ============================================================
   TWO COLUMN LAYOUT
   ============================================================ */
.cols-2 {
  display: grid;
  grid-template-columns: 1fr 320px;
  gap: var(--s5);
  align-items: start;
}

/* ============================================================
   TRANSACTION LIST
   ============================================================ */
.tx-list { display: flex; flex-direction: column; }

.tx-item {
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding: var(--s3) 0;
  border-bottom: 1px solid var(--line);
  user-select: none;
  transition: background .1s;
}
.tx-item:last-child { border-bottom: none; }
.tx-item.dragging  { opacity: .4; }
.tx-item.drag-over { background: var(--card-bg2); border-radius: var(--radius-sm); padding-left: var(--s3); padding-right: var(--s3); margin: 0 calc(-1 * var(--s3)); }

.drag-handle { color: var(--ink3); font-size: 13px; cursor: grab; flex-shrink: 0; line-height: 1; }

.tx-icon {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}

.tx-info { flex: 1; min-width: 0; }
.tx-name { font-size: var(--f-md); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-meta { font-size: var(--f-xs); color: var(--ink3); margin-top: 2px; }

.tx-amount { font-size: var(--f-md); font-weight: 700; flex-shrink: 0; white-space: nowrap; }
.tx-amount.green { color: var(--green); }
.tx-amount.red   { color: var(--red); }

.tx-actions {
  display: flex;
  gap: 4px;
  opacity: 0;
  transition: opacity .15s;
  flex-shrink: 0;
}
.tx-item:hover .tx-actions { opacity: 1; }
.tx-action-btn {
  width: 30px; height: 30px;
  border: 1px solid var(--line);
  background: var(--card-bg);
  border-radius: 6px;
  font-size: 13px;
  color: var(--ink2);
  display: flex; align-items: center; justify-content: center;
  transition: all .12s;
}
.tx-action-btn:hover        { border-color: var(--line2); background: var(--card-bg2); }
.tx-action-btn.del:hover    { border-color: #fca5a5; background: #fef2f2; color: var(--red); }
.tx-action-btn.edit:hover   { border-color: #93c5fd; background: #eff6ff; color: var(--blue); }
body.dark .tx-action-btn.del:hover  { background: #2d1a1a; border-color: #7f1d1d; }
body.dark .tx-action-btn.edit:hover { background: #1a2d3d; border-color: #1e3a5f; }

/* Filter pills */
.pill-row { display: flex; gap: var(--s2); flex-wrap: wrap; }
.pill {
  background: none;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px 12px;
  font-size: var(--f-xs);
  color: var(--ink2);
  transition: all .12s;
}
.pill.active { background: var(--brand); border-color: var(--brand); color: #fff; }
body.dark .pill.active { color: #000; }
.pill:hover:not(.active) { border-color: var(--line2); color: var(--ink); }

/* Empty state */
.empty {
  text-align: center;
  padding: var(--s10) 0;
  color: var(--ink3);
  font-size: var(--f-sm);
}
.empty .empty-icon { font-size: 32px; margin-bottom: var(--s3); }

/* ============================================================
   BAR CHART
   ============================================================ */
.bar-chart { display: flex; flex-direction: column; gap: var(--s3); }
.bar-row {
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding: var(--s1) var(--s2);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background .1s;
}
.bar-row:hover { background: var(--card-bg2); }
.bar-label { font-size: var(--f-xs); color: var(--ink2); width: 90px; text-align: right; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { flex: 1; height: 8px; background: var(--card-bg2); border-radius: 999px; overflow: hidden; }
body.dark .bar-track { background: var(--card-bg2); }
.bar-fill  { height: 100%; border-radius: 999px; transition: width .4s ease; }
.bar-pct   { font-size: var(--f-xs); color: var(--ink3); width: 32px; text-align: right; flex-shrink: 0; }
.bar-value { font-size: var(--f-xs); font-weight: 700; color: var(--ink2); width: 80px; text-align: right; flex-shrink: 0; }

/* ============================================================
   BANK ACCOUNTS
   ============================================================ */
.bank-grid { display: flex; flex-direction: column; gap: var(--s3); margin-bottom: var(--s5); }

.bank-card {
  background: var(--card-bg);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.bank-main {
  display: flex;
  align-items: center;
  gap: var(--s4);
  padding: var(--s4) var(--s5);
}
.bank-ico {
  width: 42px; height: 42px;
  border-radius: var(--radius-sm);
  background: rgba(26,158,110,.12);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}
.bank-info { flex: 1; min-width: 0; }
.bank-name { font-size: var(--f-md); font-weight: 700; }
.bank-type { font-size: var(--f-xs); color: var(--ink3); margin-top: 2px; }
.bank-bal  { font-size: var(--f-lg); font-weight: 700; color: var(--green); flex-shrink: 0; }
.bank-card-btn {
  width: 32px; height: 32px;
  border: none; background: none;
  border-radius: var(--radius-sm);
  font-size: 14px; color: var(--ink3);
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.bank-card-btn:hover { background: var(--card-bg2); color: var(--ink); }
.bank-card-btn.del:hover { color: var(--red); }

.bank-edit-form {
  border-top: 1px solid var(--line);
  padding: var(--s4) var(--s5);
  display: none;
  grid-template-columns: 1fr 1fr 140px;
  gap: var(--s3);
  align-items: end;
  background: var(--card-bg2);
}
.bank-edit-form.open { display: grid; }
.bank-edit-form input { height: 38px; }
.bank-edit-btns { display: flex; gap: var(--s2); }
.bank-edit-btns .btn { height: 38px; font-size: var(--f-sm); }

/* Net summary grid */
.net-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--s4);
  margin-bottom: var(--s6);
}
.net-card {
  background: var(--card-bg);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: var(--s5);
  box-shadow: var(--shadow);
}
.net-card.highlight { border-color: var(--line2); border-width: 2px; }
.net-card .n-lbl { font-size: var(--f-xs); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: var(--ink3); margin-bottom: var(--s2); }
.net-card .n-val { font-size: var(--f-xl); font-weight: 700; }
.net-card .n-val.green { color: var(--green); }
.net-card .n-val.red   { color: var(--red); }

/* ============================================================
   IMPORT WIZARD
   ============================================================ */
.src-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s4); max-width: 500px; margin-bottom: var(--s6); }
.src-card {
  background: var(--card-bg);
  border: 2px solid var(--line);
  border-radius: var(--radius);
  padding: var(--s6) var(--s5);
  text-align: center;
  cursor: pointer;
  transition: border-color .15s;
  box-shadow: var(--shadow);
}
.src-card:hover  { border-color: var(--line2); }
.src-card.active { border-color: var(--brand); }
.src-icon { font-size: 38px; margin-bottom: var(--s3); }
.src-name { font-size: var(--f-lg); font-weight: 700; margin-bottom: var(--s1); }
.src-desc { font-size: var(--f-xs); color: var(--ink3); }

.info-box {
  background: #EFF6FF;
  border: 1px solid #BFDBFE;
  border-radius: var(--radius);
  padding: var(--s4) var(--s5);
  margin-bottom: var(--s4);
}
body.dark .info-box { background: #1E2A3A; border-color: #2D4A6A; }
.info-box .ib-title { font-size: var(--f-sm); font-weight: 700; color: #1D4ED8; margin-bottom: var(--s3); }
body.dark .info-box .ib-title { color: #93C5FD; }
.info-box ol { padding-left: var(--s5); }
.info-box li { font-size: var(--f-sm); color: #1E3A8A; line-height: 1.9; }
body.dark .info-box li { color: #BFDBFE; }
.info-box code { background: #DBEAFE; padding: 1px 5px; border-radius: 4px; font-size: 11px; }
body.dark .info-box code { background: #1E3A5A; color: #93C5FD; }

.file-drop {
  border: 2px dashed var(--line2);
  border-radius: var(--radius);
  padding: var(--s10) var(--s6);
  text-align: center;
  cursor: pointer;
  background: var(--card-bg2);
  transition: border-color .15s, background .15s;
}
.file-drop:hover, .file-drop.over { border-color: var(--brand); background: var(--card-bg); }
.fd-icon  { font-size: 28px; margin-bottom: var(--s3); }
.fd-name  { font-size: var(--f-md); font-weight: 600; margin-bottom: var(--s1); }
.fd-hint  { font-size: var(--f-xs); color: var(--ink3); }

.iw-summary { display: flex; gap: var(--s3); margin-bottom: var(--s4); }
.iw-sc { background: var(--card-bg); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: var(--s4); flex: 1; }
.iw-sc .il { font-size: var(--f-xs); color: var(--ink3); text-transform: uppercase; letter-spacing: .4px; margin-bottom: var(--s1); }
.iw-sc .iv { font-size: var(--f-lg); font-weight: 700; }
.iw-sc .iv.green { color: var(--green); }
.iw-sc .iv.red   { color: var(--red); }

.iw-table-wrap { max-height: 420px; overflow-y: auto; border-radius: var(--radius); border: 1px solid var(--line); margin-bottom: var(--s4); }
table { width: 100%; border-collapse: collapse; font-size: var(--f-sm); }
thead th {
  background: var(--card-bg2);
  padding: 10px var(--s4);
  text-align: left;
  font-size: var(--f-xs);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .4px;
  color: var(--ink3);
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0;
  white-space: nowrap;
}
tbody td { padding: 9px var(--s4); border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
tbody tr.skipped td { opacity: .35; }
td select { height: 28px; font-size: var(--f-xs); width: 130px; }

.type-group { display: flex; gap: var(--s1); }
.type-btn {
  height: 26px; padding: 0 9px;
  border: 1px solid var(--line);
  border-radius: 5px;
  font-size: var(--f-xs);
  background: var(--card-bg2);
  color: var(--ink2);
  transition: all .1s;
}
.type-btn.exp.on { background: #FEE2E2; border-color: #FCA5A5; color: var(--red); }
.type-btn.inc.on { background: #DCFCE7; border-color: #86EFAC; color: var(--green); }
.type-btn.skip.on{ background: var(--card-bg2); border-color: var(--line2); color: var(--ink3); }

.err { color: var(--red); font-size: var(--f-sm); margin-top: var(--s2); }
.btn-row { display: flex; gap: var(--s3); flex-wrap: wrap; margin-top: var(--s2); }

/* ============================================================
   SETTINGS
   ============================================================ */
.settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s5); align-items: start; }

.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s4);
  padding: var(--s4) 0;
  border-bottom: 1px solid var(--line);
}
.setting-row:last-child { border-bottom: none; }
.s-lbl { font-size: var(--f-md); font-weight: 500; }
.s-sub { font-size: var(--f-xs); color: var(--ink3); margin-top: 2px; }

/* Toggle switch */
.toggle { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-track {
  position: absolute; inset: 0;
  background: var(--card-bg2);
  border: 1px solid var(--line2);
  border-radius: 999px;
  cursor: pointer;
  transition: background .2s, border-color .2s;
}
.toggle input:checked + .toggle-track { background: var(--brand); border-color: var(--brand); }
.toggle-knob {
  position: absolute;
  top: 2px; left: 2px;
  width: 18px; height: 18px;
  background: #fff;
  border-radius: 50%;
  box-shadow: 0 1px 3px rgba(0,0,0,.2);
  pointer-events: none;
  transition: transform .2s;
}
.toggle input:checked ~ .toggle-knob { transform: translateX(20px); }

/* Font size selector */
.fs-btns { display: flex; gap: var(--s2); }
.fs-btn {
  height: 32px; padding: 0 var(--s4);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--card-bg2);
  font-size: var(--f-sm);
  color: var(--ink2);
  transition: all .12s;
}
.fs-btn.active { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 700; }
body.dark .fs-btn.active { color: #000; }

.cur-input {
  width: 80px !important;
  height: 34px !important;
  text-align: center;
  padding: 0 var(--s3) !important;
}

.about-card {
  background: var(--card-bg2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: var(--s5);
  font-size: var(--f-sm);
  color: var(--ink2);
  line-height: 1.7;
}
.about-card strong { color: var(--ink); }

/* ============================================================
   MODALS (edit + category drill-down)
   ============================================================ */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 300;
  align-items: center;
  justify-content: center;
  padding: var(--s5);
}
.overlay.open { display: flex; }

.modal {
  background: var(--card-bg);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: 0 8px 40px rgba(0,0,0,.2);
  width: 100%;
  max-width: 460px;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.modal-hd {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--s5) var(--s6);
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.modal-title { font-size: var(--f-lg); font-weight: 700; }
.modal-close {
  width: 32px; height: 32px;
  border: none; background: none;
  border-radius: var(--radius-sm);
  font-size: 18px; color: var(--ink3);
}
.modal-close:hover { background: var(--card-bg2); color: var(--ink); }
.modal-bd {
  padding: var(--s6);
  display: flex;
  flex-direction: column;
  gap: var(--s4);
  overflow-y: auto;
  flex: 1;
}
.modal-ft {
  padding: var(--s4) var(--s6);
  border-top: 1px solid var(--line);
  display: flex;
  gap: var(--s3);
  justify-content: flex-end;
  flex-shrink: 0;
}
.modal-row { display: grid; gap: var(--s3); }
.modal-row.two { grid-template-columns: 1fr 1fr; }

/* Category drill-down modal */
.cat-modal { max-width: 560px; }
.cat-stats {
  display: flex;
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.cat-stat {
  flex: 1;
  padding: var(--s4) var(--s5);
  text-align: center;
  border-right: 1px solid var(--line);
}
.cat-stat:last-child { border-right: none; }
.cat-stat .cs-lbl { font-size: var(--f-xs); color: var(--ink3); text-transform: uppercase; letter-spacing: .4px; margin-bottom: var(--s1); }
.cat-stat .cs-val { font-size: var(--f-xl); font-weight: 700; }

.cat-list { overflow-y: auto; flex: 1; }
.cat-entry {
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding: var(--s3) var(--s5);
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  transition: background .1s;
}
.cat-entry:last-child { border-bottom: none; }
.cat-entry:hover { background: var(--card-bg2); }
.cat-entry .ce-ico { width: 34px; height: 34px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.cat-entry .ce-info { flex: 1; min-width: 0; }
.cat-entry .ce-name { font-size: var(--f-sm); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cat-entry .ce-date { font-size: var(--f-xs); color: var(--ink3); margin-top: 2px; }
.cat-entry .ce-amt  { font-size: var(--f-sm); font-weight: 700; flex-shrink: 0; }
.cat-entry .ce-amt.red   { color: var(--red); }
.cat-entry .ce-amt.green { color: var(--green); }

/* ============================================================
   TOAST
   ============================================================ */
.toast {
  position: fixed;
  bottom: var(--s6);
  left: 50%;
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--card-bg);
  font-size: var(--f-sm);
  font-weight: 600;
  padding: 9px var(--s5);
  border-radius: 999px;
  box-shadow: 0 4px 16px rgba(0,0,0,.2);
  opacity: 0;
  pointer-events: none;
  white-space: nowrap;
  transition: opacity .2s;
  z-index: 999;
}
.toast.show { opacity: 1; }

/* ============================================================
   UTILITIES
   ============================================================ */
.mb-4 { margin-bottom: var(--s4); }
.mb-5 { margin-bottom: var(--s5); }
.mb-6 { margin-bottom: var(--s6); }

@keyframes shake {
  0%,100% { transform: translateX(0); }
  25%      { transform: translateX(-5px); }
  75%      { transform: translateX(5px); }
}
.shake { animation: shake .25s ease; border-color: var(--red) !important; }

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 3px; }

/* ── Recurring list ── */
.rec-item {
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding: var(--s3) 0;
  border-bottom: 1px solid var(--line);
}
.rec-item:last-child { border-bottom: none; }
.rec-icon { width: 36px; height: 36px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.rec-info { flex: 1; min-width: 0; }
.rec-name { font-size: var(--f-md); font-weight: 600; }
.rec-meta { font-size: var(--f-xs); color: var(--ink3); margin-top: 2px; }
.rec-amount { font-size: var(--f-md); font-weight: 700; flex-shrink: 0; }
.rec-amount.green { color: var(--green); }
.rec-amount.red   { color: var(--red); }
.rec-pause { display: inline-flex; align-items: center; gap: 4px; font-size: var(--f-xs); }
.rec-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: var(--f-xs);
  font-weight: 600;
  flex-shrink: 0;
}
.rec-badge.active { background: rgba(26,158,110,.12); color: var(--green); }
.rec-badge.paused { background: var(--card-bg2); color: var(--ink3); border: 1px solid var(--line); }
.rec-actions { display: flex; gap: 4px; flex-shrink: 0; }

/* ── Trend chart ── */
.trend-months {
  display: flex;
  gap: var(--s3);
  align-items: flex-end;
  min-width: 500px;
  padding-bottom: var(--s3);
}
.trend-month-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--s2);
  cursor: pointer;
}
.trend-month-col:hover .trend-bars { opacity: .8; }
.trend-bars {
  display: flex;
  gap: 4px;
  align-items: flex-end;
  height: 160px;
  transition: opacity .15s;
}
.trend-bar {
  width: 20px;
  border-radius: 4px 4px 0 0;
  min-height: 4px;
  transition: height .4s ease;
}
.trend-month-lbl {
  font-size: var(--f-xs);
  color: var(--ink3);
  font-weight: 500;
  white-space: nowrap;
}
.trend-month-col.current .trend-month-lbl { color: var(--ink); font-weight: 700; }
.trend-legend {
  display: flex;
  gap: var(--s5);
  margin-bottom: var(--s4);
}
.trend-legend-item {
  display: flex;
  align-items: center;
  gap: var(--s2);
  font-size: var(--f-sm);
  color: var(--ink2);
}
.trend-legend-dot {
  width: 10px; height: 10px;
  border-radius: 2px;
  flex-shrink: 0;
}

/* ── Net worth line chart ── */
.nw-chart-wrap { position: relative; height: 160px; }
.nw-svg { width: 100%; height: 100%; overflow: visible; }
.nw-axis-lbl { font-size: 10px; fill: var(--ink3); }
.nw-point { cursor: pointer; }
.nw-empty { text-align: center; padding: var(--s8) 0; color: var(--ink3); font-size: var(--f-sm); }


/* ── Petrol log table ── */
.pt-table { width:100%; border-collapse:collapse; font-size:var(--f-sm); }
.pt-table th { background:var(--card-bg2); padding:10px 16px; text-align:left; font-size:var(--f-xs); font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--ink3); border-bottom:1px solid var(--line); }
.pt-table td { padding:10px 16px; border-bottom:1px solid var(--line); vertical-align:middle; }
.pt-table tr:last-child td { border-bottom:none; }
.pt-table .del-btn { background:none; border:none; cursor:pointer; color:var(--ink3); font-size:16px; }
.pt-table .del-btn:hover { color:var(--red); }

/* ── Report ── */
@media print {
  .sb, .page-header .sub, #print-report-btn, .page-header + div { display:none !important; }
  .main { width:100% !important; }
  #page-report { display:block !important; }
  .page:not(#page-report) { display:none !important; }
  body { background:#fff !important; }
}
.report-section { margin-bottom:24px; }
.report-section h3 { font-size:var(--f-lg); font-weight:700; margin-bottom:12px; padding-bottom:8px; border-bottom:2px solid var(--line); }
.report-row { display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px solid var(--line); font-size:var(--f-sm); }
.report-row:last-child { border-bottom:none; }
.report-row .rr-label { color:var(--ink2); }
.report-row .rr-val   { font-weight:600; }
.report-row .rr-val.red   { color:var(--red); }
.report-row .rr-val.green { color:var(--green); }
.report-total { display:flex; justify-content:space-between; padding:12px 0 0; margin-top:8px; border-top:2px solid var(--line); font-weight:700; font-size:var(--f-lg); }




/* ══════════════════════════════════════════════════════════
   PWA RESPONSIVE — MOBILE FIRST
   ══════════════════════════════════════════════════════════ */

/* ── Bottom nav bar (mobile) ── */

/* ══════════════════════════════════════════════════════════
   RESPONSIVE — MOBILE (iPhone / Android)
   Key insight: sidebar stays in flow as flex column,
   but on mobile we give it fixed height at bottom and
   .main fills remaining space with overflow-y:auto.
   ══════════════════════════════════════════════════════════ */
@media (max-width: 680px) {

  /* Body stays as flex-row but sidebar is narrow/hidden visually */
  html, body { height: 100%; overflow: hidden; }

  body {
    flex-direction: row;
    position: fixed;
    inset: 0;
  }

  /* Sidebar: thin strip, fixed at bottom */
  .sb {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    width: 100%;
    height: calc(58px + env(safe-area-inset-bottom, 0px));
    flex-direction: row;
    flex-shrink: 0;
    z-index: 100;
    overflow: hidden;
  }

  .sb-brand  { display: none; }
  .sb-month  { display: none; }
  .nav-spacer{ display: none; }

  .sb-nav {
    flex-direction: row;
    padding: 4px 0 0;
    gap: 0;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    width: 100%;
    align-items: flex-start;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .sb-nav::-webkit-scrollbar { display: none; }

  .nav-item {
    flex-direction: column;
    gap: 2px;
    padding: 5px 2px 6px;
    border-radius: 8px;
    font-size: 9px;
    flex: 1;
    min-width: 44px;
    color: rgba(255,255,255,.5);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: clip;
  }
  .nav-item .icon { font-size: 18px; width: auto; }
  .nav-item.active { background: rgba(255,255,255,.14); color: #fff; }

  /* Main: fill all width, scroll vertically, bottom padding for nav bar */
  .main {
    flex: 1;
    width: 100%;
    height: 100%;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: calc(68px + env(safe-area-inset-bottom, 0px));
  }

  /* Pages must be block and visible when active */
  .page        { display: none; }
  .page.active { display: block; min-height: 50px; }

  /* Month nav strip */
  .month-controls { display: flex !important; }

  /* Page spacing tighter on mobile */
  .page-header        { padding: 14px 14px 0; }
  .page-header h2     { font-size: var(--f-xl); }
  .page-header .sub   { font-size: var(--f-xs); margin-top: 2px; }
  .page-body          { padding: 12px 14px 24px; }

  /* Stat cards: 2 wide + 1 full */
  .stat-row { grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .stat-row .stat-card:nth-child(3) { grid-column: 1 / -1; }
  .stat-card { padding: 12px 14px; }
  .stat-card .s-value { font-size: var(--f-lg); }

  /* Net summary grid: 2 cols */
  .net-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
  .net-card .n-val { font-size: var(--f-lg); }

  /* All two-col layouts stack */
  .cols-2        { grid-template-columns: 1fr; }
  .settings-grid { grid-template-columns: 1fr; }

  /* Add expense form: stack clearly */
  .add-row {
    display: flex !important;
    flex-direction: column !important;
    gap: 10px;
  }
  .add-row .btn {
    width: 100%;
    height: 50px;
    font-size: var(--f-lg);
  }

  /* MUST be 16px to prevent iOS auto-zoom on focus */
  input, select, textarea { font-size: 16px !important; }
  input  { height: 48px; }
  select { height: 48px; }

  /* Category grid: bigger tiles */
  .cat-grid { grid-template-columns: repeat(auto-fill, minmax(80px,1fr)); gap: 6px; }
  .cat-btn  { padding: 10px 4px; font-size: 10px; }
  .cat-btn .ci { font-size: 20px; }

  /* Transaction items: always show actions on touch */
  .tx-item    { padding: 10px 0; }
  .tx-icon    { width: 38px; height: 38px; font-size: 17px; }
  .tx-actions { opacity: 1 !important; }
  .tx-action-btn { width: 38px; height: 38px; font-size: 15px; }

  /* Modals: sheet from bottom */
  .overlay  { padding: 0; align-items: flex-end; }
  .modal    { max-width: 100%; border-radius: 16px 16px 0 0; max-height: 88vh; }
  .cat-modal{ max-width: 100%; border-radius: 16px 16px 0 0; max-height: 88vh; }

  /* Bank edit form */
  .bank-edit-form { grid-template-columns: 1fr 1fr !important; gap: 8px; }

  /* Trend chart scrollable */
  #trend-chart-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .trend-months { min-width: 340px; }

  /* Petrol/bank add forms: stack on mobile */
  .panel-bd > div[style*="grid-template-columns"] {
    display: flex !important;
    flex-direction: column !important;
    gap: 10px;
  }
  .panel-bd > div[style*="grid-template-columns"] .btn {
    width: 100%; height: 48px;
  }
}

/* Tiny phones (SE, 320px) */
@media (max-width: 374px) {
  .nav-item { min-width: 38px; font-size: 8px; }
  .nav-item .icon { font-size: 16px; }
}

/* Tablet */
@media (min-width: 681px) and (max-width: 900px) {
  :root { --sb-w: 180px; }
  .cols-2   { grid-template-columns: 1fr; }
  .net-grid { grid-template-columns: repeat(2,1fr); }
}

</head>

    <div class="page-body">

                2. Delete all existing code, paste everything from <strong>google-apps-script.js</strong> (in the zip)<br/>
                3. Click Save → <strong>Deploy → New deployment</strong><br/>
                4. Type: <strong>Web app</strong> · Execute as: <strong>Me</strong> · Access: <strong>Anyone</strong><br/>
                5. Click Deploy → Google will ask you to authorise → click Allow<br/>
                6. Copy the <strong>/exec</strong> URL → paste above → click Test connection<br/><br/>
                <strong>⚠️ If "Failed to fetch" appears:</strong><br/>

<script>
// ── Service worker registration ──
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./service-worker.js');
  });
}

// ── Mobile month nav sync ──
function syncMobileMonthNav() {
  var lbl = document.getElementById('month-label');
  var lblM = document.getElementById('month-label-m');
  if (lblM && lbl) lblM.textContent = lbl.textContent;
}
var origRender = render;
render = function() {
  origRender();
  syncMobileMonthNav();
};
window.addEventListener('resize', function() {
  var nav = document.getElementById('mobile-month-nav');
  if (nav) nav.style.display = window.innerWidth <= 640 ? 'flex' : 'none';
});
window.dispatchEvent(new Event('resize'));

var pMM = document.getElementById('prev-month-m');
var nMM = document.getElementById('next-month-m');
if (pMM) pMM.addEventListener('click', function() { document.getElementById('prev-month').click(); syncMobileMonthNav(); });
if (nMM) nMM.addEventListener('click', function() { document.getElementById('next-month').click(); syncMobileMonthNav(); });
</script>
